project_id = "gametensor"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 15

[studio]
enabled = true
port = 54323

[local_smtp]
enabled = true
port = 54324

[storage]
enabled = true
file_size_limit = "50MiB"

[auth]
enabled = true
site_url = "http://localhost:3000"
# Redirect allowlist (exact-match, no wildcards per demo-completion-plan.md 3.4).
# The password-recovery email redirects back to the app, which then routes to
# /reset-callback on the PASSWORD_RECOVERY event. On Flutter web (hash router)
# the app passes <origin>/#/reset-callback; GoTrue drops the fragment and matches
# the <origin> — locally that equals site_url, so no extra entry is needed here.
# At deploy, set site_url to the Vercel URL and add any other origins below.
additional_redirect_urls = [
  "io.supabase.gametensor://login-callback",
  "http://localhost:3000",
  "http://127.0.0.1:3000",
  "http://localhost:8099",
  "http://127.0.0.1:8099",
]
jwt_expiry = 3600
enable_signup = true

[auth.email]
enable_signup = true
enable_confirmations = false # set true in production; disabled locally for fast iteration

# OAuth providers are disabled locally until real credentials are supplied.
# Flip enabled = true and set the env vars when wiring up Google/Apple sign-in.
[auth.external.google]
enabled = false
client_id = "env(GOOGLE_CLIENT_ID)"
secret = "env(GOOGLE_CLIENT_SECRET)"

[auth.external.apple]
enabled = false
client_id = "env(APPLE_CLIENT_ID)"
secret = "env(APPLE_CLIENT_SECRET)"

[edge_runtime]
enabled = true

[functions.igdb-search]
verify_jwt = true

[functions.bgg-search]
verify_jwt = true

# rag-chat is user-facing: the gateway verifies the JWT, then the function
# decodes it for the user id (ownership + rate limiting).
[functions.rag-chat]
verify_jwt = true

# embed-games is cron/service-role, not user-facing: it authenticates via a
# CRON_SECRET header check in-code, so JWT verification is disabled at the gateway.
[functions.embed-games]
verify_jwt = false
